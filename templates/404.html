{% extends 'base/base.html' %}
{% load static %}

{% block title %}404 - Page Not Found{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/404.css' %}">
{% endblock %}

{% block content %}
<section class="error404">
  <div class="error404__glow error404__glow--one"></div>
  <div class="error404__glow error404__glow--two"></div>

  <div class="error404__content">
    <div class="error404__illustration-card">
      <img
        src="{% static 'images/owl-404.png' %}"
        alt="Wise owl looking at a map"
        class="error404__illustration"
      >
    </div>

    <div class="error404__text">
      <p class="error404__code">404</p>
      <h1 class="error404__title">Class Not in Session</h1>
      <p class="error404__subtitle">
        It looks like the page you are looking for has taken a field trip.
      </p>
    </div>

    <div class="error404__actions">
      <a href="{% url 'index' %}" class="error404__button">
        <span class="error404__button-icon" aria-hidden="true">⌂</span>
        Return to the Hive
      </a>
    </div>
  </div>
</section>
{% endblock %}
