{% extends 'base/base.html' %}

{% load static %}
{% load i18n %}

{% block content %}
<section class="no-change-page">
  <article class="no-change-card">
    <div class="no-change-illustration-wrap">
      <img
        src="{% static 'images/no-changes-detected.png' %}"
        alt="{% trans 'No changes detected' %}"
        class="no-change-illustration"
      >
    </div>

    <h1 class="no-change-title">{% trans "No changes detected" %}</h1>

    <p class="no-change-text">
      {% trans "Please add a different file or rename the current one before marking the paper as complete." %}
    </p>

    <div class="no-change-actions">
      <a href="javascript:history.back()" class="no-change-btn no-change-btn--primary">
        {% trans "Go Back" %}
      </a>

      <a href="{% url 'teacher-papers' %}" class="no-change-btn no-change-btn--ghost">
        {% trans "Back to Taken Papers" %}
      </a>
    </div>
  </article>
</section>
{% endblock %}
