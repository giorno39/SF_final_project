{% extends 'base/base.html' %}

{% block content %}
<div class="auth-form-container">
    <h2>Complete paper</h2>
    <form class="auth-form" method="post" action="{% url 'term-paper-complete' pk=object.pk %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="paper-file-field">
            <label class="paper-file-label">Content:</label>

            {% if object.content %}
                <span class="paper-file-current-name" title="{{ object.content.name }}">
                    {{ object.content.name }}
                </span>
            {% endif %}
        </div>

        <div class="paper-file-field">
            <label class="paper-file-label">Solution:</label>

            <div class="paper-file-upload-box">
                {{ form.content }}
            </div>

            {% if form.content.errors %}
                <span class="field-error">{{ form.content.errors.0 }}</span>
            {% endif %}
        </div>

        <button type="submit">Mark complete</button>
    </form>
</div>
{% endblock %}
