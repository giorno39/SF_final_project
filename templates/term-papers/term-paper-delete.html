{% extends 'base/base.html' %}
{% load i18n %}

{% block content %}
<section class="container lesson-wrap">
  <article class="lesson-card">

    <header class="lesson-header">
      <div class="lesson-avatar">!</div>
      <div>
        <h1 class="lesson-title">{% trans "Delete term paper" %}</h1>
        <p class="lesson-sub">
          <span class="badge">{% trans "Confirmation required" %}</span>
        </p>
      </div>
    </header>

    <div class="lesson-info">
      <p class="term-paper-card-p">
        {% trans "Are you sure you want to delete this post?" %}
      </p>
    </div>

    <div class="lesson-actions">
      <form method="post" action="{% url 'term-paper-delete' pk=object.pk %}">
        {% csrf_token %}
        <button type="submit" class="btn">{% trans "Yes, delete" %}</button>
      </form>

      <a class="main-card-link" href="{% url 'term-paper-details' pk=object.pk %}">
        {% trans "Go back" %}
      </a>
    </div>

  </article>
</section>
{% endblock %}
