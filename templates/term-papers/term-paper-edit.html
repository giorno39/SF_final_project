{% extends 'base/base.html' %}
{% load i18n %}

{% block content %}
<div class="auth-form-container">
    <h2>{% trans "Edit term paper" %}</h2>

    <form class="auth-form" method="post" action="{% url 'term-paper-edit' pk=object.pk %}" enctype="multipart/form-data">
        {{ form.as_p }}
        {% csrf_token %}
        <button type="submit">{% trans "Save changes" %}</button>
    </form>
</div>
{% endblock %}
