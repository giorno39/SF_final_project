{% extends 'base/base.html' %}
{% load i18n %}

{% block content %}
<section class="container trophy-status-wrap">
  <article class="trophy-status-card">

    <div class="trophy-status-icon">★</div>

    <h1 class="trophy-status-title">{% trans "Already rated" %}</h1>

    <p class="trophy-status-text">
      {% trans "This completed task has already been rated, so you cannot submit another rating." %}
    </p>

    <div class="trophy-status-actions">
      <a class="main-card-link" href="javascript:history.back()">
        {% trans "Go back" %}
      </a>
    </div>

  </article>
</section>
{% endblock %}
