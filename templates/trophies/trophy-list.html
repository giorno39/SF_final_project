{% extends 'base/base.html' %}

{% block content %}
<section class="container trophies-wrap">

  {% for object in object_list %}
    <article class="trophy-card">

      <div class="trophy-header">
        <div class="trophy-rate">
          ⭐ {{ object.rate }}
        </div>

        <div class="trophy-date">
          {{ object.obtained_at }}
        </div>
      </div>

      <div class="trophy-project">
        <span class="trophy-label">Project:</span>
        {{ object.project }}
      </div>

    </article>
  {% endfor %}

</section>
{% endblock %}
