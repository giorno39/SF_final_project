{% extends 'base/base.html' %}

{% block content %}
<section class="container lesson-wrap">
  <article class="lesson-card">

    <header class="lesson-header">
      <div class="lesson-avatar">!</div>
      <div>
        <h1 class="lesson-title">Delete material</h1>
        <p class="lesson-sub">
          <span class="badge">Confirmation required</span>
        </p>
      </div>
    </header>

    <div class="lesson-info">
      <p class="term-paper-card-p">
        Are you sure you want to delete this material?
      </p>
    </div>

    <div class="lesson-actions">
      <form method="post" action="{% url 'materials-delete' pk=object.pk %}">
        {% csrf_token %}
        <button type="submit" class="btn">Yes, delete</button>
      </form>

      <a class="main-card-link" href="{% url 'materials-details' pk=object.pk %}">
        Go back
      </a>
    </div>

  </article>
</section>
{% endblock %}
